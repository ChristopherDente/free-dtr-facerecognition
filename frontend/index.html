<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Recognition DTR App</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container min-vh-100 d-flex flex-column justify-content-center align-items-center py-5">
        
        <div class="text-center mb-5 hero-section">
            <h1 class="display-4 fw-bold gradient-text">Smart DTR System</h1>
            <p class="lead text-muted">Face Recognition & Attendance Logging using DeepFace & FastAPI.</p>
        </div>

        <div class="card shadow-lg border-0 rounded-4 w-100" style="max-width: 800px;">
            <div class="card-body p-5 text-center">
                
                <!-- Mode Toggle -->
                <div class="d-flex justify-content-center mb-4">
                    <div class="btn-group" role="group">
                        <input type="radio" class="btn-check" name="appMode" id="modeAttendance" autocomplete="off" value="attendance" checked>
                        <label class="btn btn-outline-primary px-4" for="modeAttendance">Daily Time Record</label>

                        <input type="radio" class="btn-check" name="appMode" id="modeRegister" autocomplete="off" value="register">
                        <label class="btn btn-outline-primary px-4" for="modeRegister">Register Employee</label>
                    </div>
                </div>

                <!-- Registration Input (Hidden by default) -->
                <div id="registerInputSection" class="d-none mb-4 mx-auto" style="max-width: 300px;">
                    <label for="employeeName" class="form-label fw-bold">Employee Name</label>
                    <input type="text" class="form-control text-center" id="employeeName" placeholder="e.g. John Doe">
                </div>

                <!-- Action Buttons -->
                <div class="d-flex justify-content-center gap-3 mb-4" id="actionButtons">
                    <button id="startCamBtn" class="btn btn-outline-primary btn-lg rounded-pill px-4">
                        <i class="bi bi-camera-video me-2"></i>Use Webcam
                    </button>
                    <button class="btn btn-outline-secondary btn-lg rounded-pill px-4" onclick="document.getElementById('fileInput').click()">
                        <i class="bi bi-upload me-2"></i>Upload Image
                    </button>
                    <input type="file" id="fileInput" class="d-none" accept="image/*">
                </div>

                <!-- Webcam Container -->
                <div id="webcamContainer" class="d-none mb-4">
                    <video id="webcamVideo" class="img-fluid rounded-3 shadow mb-3 bg-dark" autoplay playsinline style="max-height: 500px; width: 100%; object-fit: cover;"></video>
                    <div>
                        <button id="captureBtn" class="btn btn-primary btn-lg rounded-pill px-5 shadow-sm">
                            <i class="bi bi-camera me-2"></i><span id="captureBtnText">Capture & Log</span>
                        </button>
                        <button id="stopCamBtn" class="btn btn-outline-danger btn-lg rounded-pill px-4 ms-2">
                            Stop Camera
                        </button>
                    </div>
                </div>

                <!-- Preview and Canvas (Hidden by default) -->
                <div id="previewContainer" class="position-relative d-none mx-auto mb-4">
                    <img id="imagePreview" class="img-fluid rounded-3 shadow" alt="Preview" style="max-height: 500px;">
                    <canvas id="faceCanvas" class="position-absolute top-0 start-0 w-100 h-100"></canvas>
                </div>

                <!-- Loading State -->
                <div id="loadingState" class="d-none my-4">
                    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-3 fw-semibold text-primary" id="loadingText">Processing...</p>
                </div>

                <!-- Results -->
                <div id="results" class="alert alert-success d-none shadow-sm rounded-3 text-start">
                    <h5 class="mb-3 text-center" id="resultText">Faces found!</h5>
                    <div id="profilesContainer" class="d-flex flex-wrap gap-3 justify-content-center">
                        <!-- Profiling cards will go here -->
                    </div>
                </div>

                <!-- Reset Button -->
                <button id="resetBtn" class="btn btn-outline-secondary btn-lg rounded-pill px-5 d-none mt-3 w-100">
                    Try Again
                </button>

            </div>
        </div>
        
        <!-- DTR Table Section (Hidden during Registration) -->
        <div id="dtrTableSection" class="card shadow-lg border-0 rounded-4 w-100 mt-5" style="max-width: 800px;">
            <div class="card-body p-5">
                <h3 class="mb-4 text-center fw-bold text-primary">
                    <i class="bi bi-clock-history me-2"></i>Daily Time Record
                </h3>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Name</th>
                                <th>Date</th>
                                <th>Time</th>
                            </tr>
                        </thead>
                        <tbody id="attendanceTableBody">
                            <tr><td colspan="3" class="text-center text-muted py-4">Loading records...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="text-end mt-3">
                    <button class="btn btn-sm btn-outline-secondary" onclick="fetchAttendance()">
                        <i class="bi bi-arrow-clockwise me-1"></i>Refresh
                    </button>
                </div>
            </div>
        </div>
        
    </div>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <script src="script.js"></script>
</body>
</html>
